name: Homologação experimental
on:
  push:
    branches: [dev/extensao-consentimento]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - run: python3 -m unittest discover -s tests
      - run: npm install --no-save --package-lock=false puppeteer@25.17.0
      - run: python3 tests/browser_qa.py
      - name: Exercitar consentimento entre origens HTTPS com TLS validado
        run: |
          command -v certutil || (sudo apt-get update && sudo apt-get install -y libnss3-tools)
          python3 tests/https_qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: Roteiro-visual-Chrome
          path: evidencias/
          if-no-files-found: error
      - name: Preparar e testar ensaio local sem executável
        run: |
          mkdir entrega
          python3 monterey/preview.py 'entrega/ABRIR NO SAFARI.html'
          node monterey/preview-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Preencho-Safari-Ensaio
          path: entrega/
  xcode:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests
      - name: Gerar projeto com Xcode
        run: |
          PYTHONPATH=lab python3 - <<'PY'
          from pathlib import Path
          from mac import safari_project
          from safari_https import package
          root=Path('safari-qa').resolve()
          package(root,'https://cofre.qa.example','https://cadastro.qa.example','safari-web-extension://unpaired')
          print(safari_project(root/'extension',Path('build').resolve()))
          PY
      - name: Conferir targets e compilar app para simulador
        run: |
          python3 - <<'PY'
          import subprocess as sp,json,pathlib
          project=next(pathlib.Path('build').rglob('*.xcodeproj'))
          schemes=json.loads(sp.check_output(['xcodebuild','-list','-json','-project',str(project)]))['project']['schemes']
          for scheme in schemes:
              settings=sp.check_output(['xcodebuild','-project',str(project),'-scheme',scheme,'-showBuildSettings'],text=True)
              if 'iphonesimulator' in settings and 'WRAPPER_EXTENSION = app' in settings:
                  sp.run(['xcodebuild','-project',str(project),'-scheme',scheme,'-destination','generic/platform=iOS Simulator','CODE_SIGNING_ALLOWED=NO','build'],check=True)
                  break
          else:
              raise RuntimeError('Target de aplicativo iOS não encontrado: '+str(schemes))
          PY
      - name: Empacotar Safari para Mac Intel Monterey
        run: bash monterey/build.sh
      - name: Compilar iniciador integrado para assinatura posterior
        run: bash monterey/integrar.sh
