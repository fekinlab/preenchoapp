name: Controle de navegação WebKit
on:
  push:
    branches: [dev/extensao-consentimento]
    paths:
      - tests/webkit_navigation.py
      - .github/workflows/webkit-qa.yml
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps webkit
      - run: python tests/webkit_navigation.py
