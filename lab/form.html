<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; form-action 'none'; base-uri 'none'">
<title>Cadastro fictício · Laboratório Preenchô</title><h1>Cadastro fictício</h1><p>Confira os dados após usar a extensão. Este formulário é apenas local.</p>
<form><p><label>Nome completo <input autocomplete="name"></label></p><p><label>E-mail <input type="email"></label></p>
<p><label>Telefone <input type="tel"></label></p><p><label>CPF <input name="cpf_cliente"></label></p>
<p><label>CNPJ <input name="cnpj"></label></p><p><label>Rua <input autocomplete="address-line1"></label></p>
<p><label>Número do imóvel <input name="numeroImovel"></label></p><p><label>Bairro <input name="bairro"></label></p>
<p><label>Cidade <input name="cidade"></label></p><p><label>Estado <select autocomplete="address-level1"><option value="">Selecione</option><option>SP</option></select></label></p>
<p><label>Empresa <input autocomplete="organization"></label></p><p><label>Cargo <input autocomplete="organization-title"></label></p>
<p><label>Observações <textarea></textarea></label></p></form></html>
