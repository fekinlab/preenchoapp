<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06152f"><title>Preenchô</title><style>
:root{--navy:#06152f;--orange:#ff7509;--muted:#a8b6cc}*{box-sizing:border-box}body{margin:0;color:white;background:radial-gradient(circle at 105% 0%,#18335b 0%,transparent 35%),#06152f;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}#splash{position:fixed;inset:0;z-index:20;background:#06152f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .35s}.mark{width:46px;height:49px;flex-shrink:0}.mark.large{width:120px;height:130px;filter:drop-shadow(0 0 16px #ff730955)}.wordmark{display:flex;align-items:center;gap:9px;font-weight:850;font-size:27px;font-style:italic;letter-spacing:-1.2px}.wordmark .accent{color:#ff7d12}.wordmark.big{font-size:43px}.tagline{font-size:17px;color:#d6deed}.app{max-width:520px;margin:auto;min-height:100dvh;padding:24px 22px 118px}.header{display:flex;justify-content:space-between;align-items:center;margin:0 0 66px}.avatar{background:#213655;border:1px solid #47617e;width:43px;height:43px;border-radius:50%;display:grid;place-items:center;color:#ff9b48}.hello{font-size:39px;letter-spacing:-1.4px;font-weight:800;font-style:italic;margin:0 0 4px}.lead{font-size:20px;line-height:1.35;margin:0 0 8px}.sub{color:var(--muted);font-size:14px;margin-bottom:44px}.primary{width:100%;background:linear-gradient(110deg,#ff9f0d,#ff590d);border:0;border-radius:40px;padding:19px 17px;color:white;font-weight:750;display:flex;align-items:center;justify-content:center;gap:13px;box-shadow:0 12px 25px #ff650025;margin-bottom:23px}.primary .arrow{margin-left:auto;font-size:25px}.primary .glyph{font-size:24px}.action{width:100%;border:0;background:linear-gradient(#fff,#f2f4f8);border-radius:32px;padding:18px 20px;color:#101b30;text-align:left;font-weight:700;display:flex;align-items:center;gap:17px;margin:9px 0;box-shadow:0 3px 8px #0002}.action .ico{font-size:23px;width:29px;text-align:center}.action .chev{margin-left:auto;font-size:23px}.back{border:0;background:none;color:#ff9548;padding:0;margin:0 0 25px;font-size:16px}.page h1{font-size:31px;letter-spacing:-.6px;margin:0 0 8px}.desc{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 28px}.panel{background:#142946;border:1px solid #38516f;border-radius:20px;padding:18px;margin:12px 0}.label{color:#9eb0c7;font-size:13px;margin-bottom:7px}.value{font-size:18px}.small{font-size:14px;color:#aab9cc;line-height:1.5}.pill{display:inline-block;border-radius:30px;padding:7px 12px;background:#223f61;color:#ffae6c;font-size:12px}.wallet{background:radial-gradient(circle at 100% 0%,#ff8d0d 0%,#ff6b16 16%,transparent 42%),linear-gradient(140deg,#122d51,#07172f 70%);border:1px solid #7790ad;border-radius:25px;padding:22px;box-shadow:0 18px 35px #0005;margin:20px 0 24px}.wallet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:38px}.wallet .wordmark{font-size:21px}.wallet .mark{width:32px;height:34px}.qr{background:white;color:#132038;border-radius:9px;padding:9px;font-size:10px;text-align:center;line-height:1.2;max-width:86px}.wallet-name{font-weight:800;font-size:23px;margin-bottom:12px}.wallet-details{background:#ffffffed;color:#17223b;border-radius:16px;padding:14px;line-height:1.85;font-size:13px}.secondary{background:#122946;border:1px solid #66809d;color:white;border-radius:28px;padding:14px 20px;width:100%;margin:7px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#f9f9fc;color:#192238;border-radius:24px 24px 0 0;display:flex;justify-content:space-around;padding:15px 4px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -10px 25px #0003}.nav button{border:0;background:none;color:#1c2940;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:57px}.nav button.active{color:#ff680d}.nav .ni{font-size:23px}.note{margin-top:16px;color:#a7b8cc;font-size:12px}.hide{display:none!important}@media(min-width:600px){.nav{max-width:520px;left:50%;transform:translateX(-50%)}} 
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="brandmark" viewBox="0 0 64 70"><defs><linearGradient id="roof" x1="0" x2="1"><stop stop-color="#ffac15"/><stop offset="1" stop-color="#ff570c"/></linearGradient><linearGradient id="fade" x1="0" x2="1"><stop stop-color="#405878" stop-opacity=".45"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><path d="M8 24 31 5Q33 3 36 5L57 24" fill="none" stroke="url(#roof)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 32v21q0 9 9 9h29q9 0 9-9V33" fill="none" stroke="url(#fade)" stroke-width="8" stroke-linecap="round"/><path d="M22 31h23M22 42h23M22 53h16" stroke="white" stroke-width="6" stroke-linecap="round"/></symbol></svg>
<div id="splash"><svg class="mark large"><use href="#brandmark"/></svg><div class="wordmark big">Preench<span class="accent">ô</span></div><strong>Precisou? Preenchô!</strong><div class="tagline">Cadastre uma vez. Preencha em segundos.</div></div>
<main class="app"><header class="header"><div class="wordmark"><svg class="mark"><use href="#brandmark"/></svg>Preench<span class="accent">ô</span></div><div class="avatar">F</div></header><section id="screen"></section></main>
<nav class="nav"><button data-page="home"><span class="ni">⌂</span>Início</button><button data-page="fill"><span class="ni">▤</span>Formulários</button><button data-page="card"><span class="ni">▣</span>Cartão</button><button data-page="profiles"><span class="ni">▱</span>Perfis</button><button data-page="settings"><span class="ni">⚙</span>Ajustes</button></nav>
<script>
const logo='<div class="wordmark"><svg class="mark"><use href="#brandmark"/></svg>Preench<span class="accent">ô</span></div>';
const back='<button class="back" onclick="go(\'home\')">‹ Voltar</button>';
const action=(icon,label,page)=>'<button class="action" onclick="go(\''+page+'\')"><span class="ico">'+icon+'</span>'+label+'<span class="chev">›</span></button>';
const screens={
home:()=>'<h1 class="hello">Olá, Fekin,</h1><p class="lead">seus dados estão prontos<br>para preencher.</p><p class="sub">Cadastre uma vez. Preencha em segundos.</p><button class="primary" onclick="go(\'fill\')"><span class="glyph">▣</span>Preencher formulário<span class="arrow">›</span></button>'+action('▤','Meu Cartão Preenchô','card')+action('♙','Meus dados','data')+action('▱','Meus perfis','profiles'),
fill:()=>back+'<div class="page"><h1>Preencher formulário</h1><p class="desc">No aplicativo completo, você poderá selecionar um perfil e preencher formulários compatíveis em segundos.</p><div class="panel"><div class="label">Perfil selecionado</div><div class="value">Pessoal <span class="pill">Demonstração</span></div></div><button class="primary" onclick="alert(\'O preenchimento automático ainda não está ativo neste protótipo.\')">Simular preenchimento ›</button><p class="note">Demonstração visual: nenhum dado pessoal é enviado.</p></div>',
data:()=>back+'<div class="page"><h1>Meus dados</h1><p class="desc">Visualização de exemplo, sem armazenar informações pessoais.</p>'+[['Nome','Fekin'],['CPF','•••.•••.•••-••'],['Telefone','(••) •••••-••••'],['E-mail','email@exemplo.com']].map(x=>'<div class="panel"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('')+'</div>',
profiles:()=>back+'<div class="page"><h1>Meus perfis</h1><p class="desc">Organize diferentes contextos de preenchimento.</p><div class="panel"><div class="label">Perfil pessoal</div><div class="value">Dados do dia a dia <span class="pill">Ativo ✓</span></div></div><div class="panel"><div class="label">Perfil profissional</div><div class="value">Em breve</div></div><button class="secondary" onclick="alert(\'Novos perfis estarão disponíveis em uma próxima versão.\')">+ Novo perfil</button></div>',
card:()=>back+'<div class="page"><h1>Meu Cartão Preenchô</h1><div class="wallet"><div class="wallet-top">'+logo+'<div class="qr">QR CODE<br>em breve</div></div><div class="wallet-name">Fekin</div><div class="wallet-details">♙ &nbsp; CPF: •••.•••.•••-••<br>♧ &nbsp; Telefone: (••) •••••-••••<br>✉ &nbsp; email@exemplo.com</div></div><button class="secondary" onclick="alert(\'Apple Wallet será integrado futuramente.\')">Adicionar à Apple Wallet · em breve</button><button class="secondary" onclick="alert(\'O QR Code compartilhável será implementado com controles de privacidade.\')">Compartilhar QR Code · em breve</button><p class="note">Cartão ilustrativo. Nenhum dado pessoal real está armazenado ou compartilhado.</p></div>',
settings:()=>back+'<div class="page"><h1>Ajustes</h1><p class="desc">Em breve: proteção de dados, autenticação e preferências.</p><div class="panel">Preenchô · Protótipo visual</div></div>'
};
function go(page){document.getElementById('screen').innerHTML=(screens[page]||screens.home)();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));window.scrollTo(0,0)}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));go('home');setTimeout(()=>{let e=document.getElementById('splash');e.style.opacity='0';setTimeout(()=>e.remove(),360)},1200);
</script></body></html>
